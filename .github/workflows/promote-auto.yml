name: Promote (auto)

# release 를 자동으로 승격(= 프로덕션 배포)한다 (P6 Promotion Policy, 2026-07-24 오너 지시:
# "승격 실행의 자동화를 원한다"). 사람 손 없이 발화하되, 비용을 위해 배칭은 유지한다 —
# 매 머지 배포(= 원래의 월 ~$26 문제)로 회귀하지 않도록 두 상한 안에서만 승격한다:
#
#   ⛔ 종전의 건수 상한(push:main, COUNT_THRESHOLD)·시간 상한(schedule 4h)은
#      **SUPERSEDED**(2026-08-13 자체호스팅 컷오버) — 아래 `on:` 주석 참조.
#      지금 남은 발화 경로는 workflow_dispatch 하나뿐이고, 누르면 미승격을 전부 승격한다.
#   - 긴급 오버라이드([promote]/[deploy] 커밋 마커)와 force 입력은 그대로 둔다 —
#     수동 실행에서도 판정 로그에 "왜 갔는지"가 남는 편이 낫다.
#
# 승격은 scripts/promote-prod.sh --yes 가 수행한다(ff 강제 + 배포 완료 폴링 내장 — 문턱·ff·
# 배포확인 로직의 SSOT). 실패하면 조용히 삼키지 않고 promote-failed 이슈로 알린다(P0).
#
# ⚠️ 안전 전제: main 은 브랜치 보호가 없다(2026-08-26 무료 플랜 비공개 전환으로 ruleset
# 정지 — T-069. 종전의 "보호를 켜라(오너 설정)"는 무료 플랜 비공개에선 불가능해졌다).
# "빌드 깨지는 커밋"은 Vercel 빌드가 실패해 prod 를 바꾸지 못하고(기존 배포 유지) 이
# 워크플로가 실패로 감지한다. "빌드는 되나 기능이 깨진 커밋"은 셀프호스트 prod 레인에선
# 배포 직전 CI 게이트(infra/selfhost/deploy.sh 안전장치 ⑦)가 막는다 — 이 구 플랫폼 롤백
# 레인에는 그 게이트가 없으므로, 롤백 승격 전에 대상 커밋의 PR 검사 통과를 사람이 확인한다.
#
# ⚠️ 토큰: 레포 Actions 기본 권한이 read-only 다. 아래 permissions 로 승격(push)에 필요한
# contents:write 를 명시한다. 그래도 push 가 403 이면 Settings → Actions → General →
# Workflow permissions 를 "Read and write" 로 바꿔라(오너 1회 설정).

# ⛔ 자동 트리거는 2026-08-13 자체호스팅 컷오버로 제거했다(오너 지시 "promote-auto 는
# 끄고, 롤백은 그때 수동 승격하자"). 프로덕션은 이제 집 iMac 이 서빙하고 `release` 는
# **구 플랫폼 롤백 창구**로만 남는다 — 자동 승격을 그대로 두면 이관 후에도 4시간마다
# 구 플랫폼 빌드를 계속 태운다(한 달 병행 관찰 동안 내내).
#
# 대신 `workflow_dispatch` 는 남긴다. 롤백이 필요해지는 순간 그 시점의 코드를 구
# 플랫폼으로 올리는 경로가 필요하기 때문이다(force=true 로 문턱 무시 즉시 승격).
#
# ⚠️ 그때 알아 둘 것: **승격만으로는 구 플랫폼에서 크론이 하나도 돌지 않는다.**
# `vercel.json` 의 crons 는 2026-08-15 에 전부 제거됐다 — 컷오버 뒤에도 구 배포가 같은
# 잡을 계속 발화해 자체호스팅과 이중 실행되던 사고(07:00 / 07:01, 실측) 때문이다.
# 크론까지 되살리려면 그 제거를 되돌리는 별도 PR 이 필요하고, 그 전에 **자체호스팅
# 크론을 먼저 꺼야** 한다(rollback.sh Step 4 안내와 같은 내용).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "문턱 무시하고 즉시 승격"
        type: boolean
        default: false

permissions:
  contents: write # release 로 ff push
  issues: write # 승격 실패 알림

# 승격은 직렬로만 — 동시에 두 승격이 겹치지 않게(진행 중이면 대기, 취소하지 않음).
concurrency:
  group: promote-auto
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 배포 완료 폴링 최대 15분 + 여유
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ff 판정·커밋 카운트에 전체 히스토리 필요

      - name: Fetch lane refs
        run: |
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/release:refs/remotes/origin/release" || \
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Decide whether to promote
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          # COUNT_THRESHOLD 는 제거했다 — 건수 상한은 push 이벤트 전용이었고 그
          # 트리거가 사라졌다. 남겨두면 "쓰이지 않는데 정본처럼 보이는 값"이 되어
          # promote-prod.sh 와의 드리프트 논쟁을 되살린다.
        run: |
          set -euo pipefail
          MAIN=$(git rev-parse refs/remotes/origin/main)
          if git rev-parse -q --verify refs/remotes/origin/release >/dev/null; then
            REL=$(git rev-parse refs/remotes/origin/release)
            PENDING=$(git rev-list --count "$REL..$MAIN")
          else
            REL=""      # 첫 승격 — release 없음
            PENDING=1
          fi

          MARKER=0
          # ⚠️ `git log … | grep -q` 로 쓰지 말 것 — grep -q 는 첫 매치에서 즉시 끝나므로
          # git 이 SIGPIPE 로 죽고, 위 `set -euo pipefail` 이 그 141 을 파이프라인 상태로
          # 만들어 **조건이 거짓**이 된다(= 마커가 있는데 MARKER=0). 실측: 미승격 5건이면
          # 0/20 이지만 20건 17/20 · 50건 20/20 으로 놓친다 — 즉 **자동 승격이 막혀 백로그가
          # 쌓인 상황**에서만 고장나는데, 긴급 마커를 박는 상황이 정확히 그때다.
          # 프로세스 치환은 파이프가 아니라 SIGPIPE 자체가 성립하지 않는다.
          if [ -n "$REL" ] && [ "$PENDING" -gt 0 ] \
             && grep -qiE '\[promote\]|\[deploy\]' <(git log "$REL..$MAIN" --format=%B); then
            MARKER=1
          fi

          DECISION=skip
          REASON=""
          if [ "$PENDING" -eq 0 ]; then
            REASON="미승격 없음"
          elif [ "${FORCE_INPUT:-}" = "true" ]; then
            DECISION=go; REASON="수동 강제(force)"
          elif [ "$MARKER" = "1" ]; then
            DECISION=go; REASON="긴급 마커[promote/deploy] — 미승격 ${PENDING}건"
          else
            # 자동 트리거를 제거했으므로(2026-08-13) 여기까지 왔다는 것은 **사람이
            # 직접 눌렀다**는 뜻이다. 기다려 줄 다음 발화가 없으니 미승격이 있으면
            # 그대로 승격한다 — 문턱을 남겨두면 "눌렀는데 아무 일도 안 일어나는"
            # 조용한 skip 이 된다.
            DECISION=go; REASON="수동 실행($EVENT) — 미승격 ${PENDING}건"
          fi

          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "→ [$DECISION] $REASON"

      - name: Promote
        if: steps.decide.outputs.decision == 'go'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "승격 사유: ${{ steps.decide.outputs.reason }}"
          bash scripts/promote-prod.sh --yes

      - name: Notify on failure
        if: failure() && steps.decide.outputs.decision == 'go'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          set -euo pipefail
          LABEL="promote-failed"
          gh label create "$LABEL" --color B60205 \
            --description "자동 승격/배포 실패 (P6)" 2>/dev/null || true

          BODY_FILE="${RUNNER_TEMP:-/tmp}/promote-failed-body.md"
          cat > "$BODY_FILE" <<EOF
          자동 승격 워크플로가 실패했습니다.

          - **사유(승격 시도)**: $REASON
          - **로그**: $RUN_URL
          - **수동 확인/재시도**: \`cd ~/Projects/wag-crm && bash scripts/promote-prod.sh\`

          흔한 원인: Vercel 빌드 실패(→ prod 는 기존 배포 유지 중), 배포 확인 15분 타임아웃,
          토큰 push 권한(레포 Actions 권한이 read-only 면 "Read and write" 로 변경).
          EOF

          # 같은 라벨의 열린 이슈가 있으면 중복 생성하지 않는다.
          EXISTING=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE" >/dev/null
            echo "기존 실패 이슈 #$EXISTING 에 코멘트"
          else
            gh issue create --label "$LABEL" \
              --title "⛔ 자동 승격 실패 (run #$RUN_NUMBER)" \
              --body-file "$BODY_FILE" >/dev/null
            echo "실패 이슈 생성"
          fi
