name: Release Preflight

on:
  push:
    branches:
      - main
  # PR 트리거: Vercel 프리뷰 배포가 꺼진 뒤(vercel.json git.deploymentEnabled —
  # 비-main 브랜치는 배포 생성 안 함) 머지 전 fresh-install 빌드·테스트 검증을
  # 여기서 대신한다. 같은 레포
  # 브랜치의 PR만 시크릿을 받으며, 포크 PR에는 GitHub이 시크릿을 주지 않는다.
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    # 러너는 레포 변수 토글로 고른다(하이브리드 CI, 2026-08-26 비공개 전환 — 이
    # 워크플로가 Actions 계량분의 90%+ 라 자가호스트로 옮겼다. 좌표·폴백 절차의
    # 정본은 docs/agents/deployment.md 「Self-Hosted Preflight Runner」).
    # 변수 `PREFLIGHT_RUNNER`(=self-hosted)를 지우면 즉시 GitHub 러너로 복귀한다 —
    # 맥 러너 장애 시 PR 없이 폴백하는 장치이므로 리터럴로 굳히지 말 것.
    runs-on: ${{ vars.PREFLIGHT_RUNNER != '' && vars.PREFLIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    # 빌드용 일회용 Postgres — 프로덕션 DB 를 쓰지 않는다(2026-08-13 전환).
    #
    # 종전에는 `secrets.DATABASE_URL`(= 실 프로덕션 DB)로 빌드했다. ISR 표면이
    # 빌드 때 Prisma 로 DB 를 읽기 때문인데, 그 결과 두 가지 고질이 있었다:
    #   ① `P1001` — 풀러가 몇 초만 흔들려도 **무관한 PR** 의 빌드가 통째로 실패했다.
    #   ② `P2022` — ISR 이 읽는 테이블에 컬럼을 추가하면, 빌드 앞단의 마이그레이션이
    #      `VERCEL_ENV` 미설정으로 skip 되는 탓에 새 스키마로 없는 컬럼을 SELECT 했다.
    #      매번 "오너 승인 후 프로덕션에 선적용"으로 우회해야 했다.
    # 그리고 자체호스팅 이관(2026-08-13)으로 클라우드를 강등하면 이 의존은 곧
    # **모든 PR 을 막는 차단 요인**이 된다 — preflight 는 required 체크다.
    #
    # 일회용 DB 에 마이그레이션을 먼저 적용하고 빌드하면 셋 다 닫힌다. 데이터가 없으므로
    # 프리렌더는 빈 결과로 렌더되는데, 이 게이트의 목적("빌드가 성립하는가")에는 충분하다
    # — 실 데이터로의 렌더 검증은 승격 시점 Vercel 빌드가 아니라 자체호스팅 배포가 한다.
    #
    # 실측(2026-08-13): 빈 임시 Postgres + **도달 불가 Supabase 주소**로도
    # `next build` 가 exit 0 으로 통과했다 — 빌드는 Supabase HTTP 에 의존하지 않는다.
    services:
      postgres:
        image: postgres:17 # 프로덕션과 같은 메이저(17.6)
        env:
          # 비밀번호를 두지 않는다 — 잡 안에서만 사는 서비스이고, 자격증명이 없으면
          # 연결 문자열에 `user:pass@` 형태가 생기지 않아 commit-guard(공개 레포
          # 자격증명 차단)와도 다투지 않는다.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: preflight
        ports:
          # 🪤 **호스트 포트를 고정하지 말 것 — 러너가 여럿이면 곧 상호배타가 된다.**
          # 종전 `5432:5432` 는 러너가 1대일 때만 성립했다. 2026-08-26 러너를 3대로 늘리자
          # 셋이 **같은 Colima VM 의 Docker 데몬을 공유**하는 탓에, 먼저 시작한 잡의 서비스
          # 컨테이너가 5432 를 쥔 채 두 번째 잡이 16초 만에 죽었다(실측: 13:36 시작분이
          # 점유 → 13:38 시작분이 `Bind for :::5432 failed: port is already allocated`).
          # preflight 는 required 체크라 이 충돌은 곧 **무작위 머지 차단**이고, 메시지가
          # 코드를 가리키지 않아 원인 추적에도 시간이 든다.
          # 포트 번호만 적으면 Docker 가 빈 호스트 포트를 골라 준다 — 아래
          # 「Resolve the ephemeral Postgres host port」 스텝이 그 값을 읽어 접속 문자열을
          # 만든다. 러너를 더 늘려도 깨지지 않는다.
          # ⚠️ `migration-guard.yml` 도 같은 `5432:5432` 를 쓰지만 그쪽은 `ubuntu-latest`
          # (매번 새 VM)라 충돌하지 않는다 — 그 잡을 자가호스트로 옮기면 여기와 같이 고칠 것.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # ⚠️ `DATABASE_URL`·`DIRECT_URL` 은 여기 둘 수 없다. 서비스 컨테이너의 호스트 포트는
      # 잡이 시작돼야 정해지는데 **`job` 컨텍스트는 스텝에서만 읽히고 잡 레벨 `env:` 에서는
      # 안 읽힌다.** 그래서 아래 「Resolve the ephemeral Postgres host port」 스텝이 조립해
      # `$GITHUB_ENV` 로 넘긴다. ⛔ 편의로 여기에 되살리지 말 것 — 고정 포트로 돌아가는
      # 순간 위 ports 주석의 충돌이 그대로 재발한다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ASSET_BUCKET: ${{ secrets.SUPABASE_ASSET_BUCKET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      ASSET_TOKEN_ENCRYPTION_KEY: ${{ secrets.ASSET_TOKEN_ENCRYPTION_KEY }}
      # 프리렌더가 실 DB를 읽으며 주민등록번호를 복호화한다(cached-crm-data → campaign-row).
      # 폴백 기본 키를 없앴으므로(2026-07-23) 이 값이 없으면 빌드 리허설이 프로덕션과
      # 달라진다. 키 교체 전환 기간에는 PREVIOUS 도 함께 넘긴다.
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ENCRYPTION_KEY_PREVIOUS: ${{ secrets.ENCRYPTION_KEY_PREVIOUS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate PR Body Checklist
        if: github.event_name == 'pull_request'
        run: |
          PR_BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
          if ! echo "$PR_BODY" | grep -qF -- "- [x] 배포 지침 및 검증 로그 확인 완료"; then
            echo "Error: PR body must contain the checked marker: '- [x] 배포 지침 및 검증 로그 확인 완료'"
            echo "에이전트는 반드시 배포 지침을 읽고 룰에 따라 이 마커를 본문에 추가해야 합니다."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          # ⚠️ 자가호스트에서는 npm 캐시를 **끈다**(빈 값 = 비활성). 이 캐시는 GitHub
          # 캐시 서비스에서 내려받는 것이라 데이터센터 밖 러너에서는 순손해다 —
          # 실측(2026-08-26): 416MB 를 0.4~0.9MB/s 로 받아 이 스텝 하나가 12분,
          # test 잡이 20분 타임아웃으로 취소됐다. 자가호스트 러너는 홈의 `~/.npm`
          # (실측 480MB)이 잡 사이에 그대로 남으므로 원격 캐시가 애초에 필요 없다.
          # GitHub 러너로 폴백하면(변수 없음) 작업 공간이 매번 새것이라 캐시가 다시
          # 이득이므로, 러너 토글과 같은 변수로 함께 갈린다.
          cache: ${{ vars.PREFLIGHT_RUNNER == '' && 'npm' || '' }}

      - name: Validate required preflight secrets
        run: |
          # DATABASE_URL·DIRECT_URL 은 목록에서 뺐다 — 더 이상 시크릿이 아니라
          # 이 잡의 services 로 뜨는 일회용 DB 다(위 env 블록에 리터럴로 있다).
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_APP_URL ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # ⚠️ `npm ci` 보다 **먼저** 와야 한다 — postinstall 의 Prisma 클라이언트 생성이
      # `DATABASE_URL` 을 읽는다.
      - name: Resolve the ephemeral Postgres host port
        env:
          POSTGRES_HOST_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          # 빈 값이면 여기서 멈춘다. 그대로 흘려보내면 접속 문자열이 `localhost:/preflight`
          # 가 되어 **실패 원인이 DB 장애로 위장**된다 — 이 워크플로가 2026-08-13 에
          # 없애려던 실패 모드(P1001 오진)와 같은 얼굴이다.
          if [ -z "$POSTGRES_HOST_PORT" ]; then
            echo "서비스 컨테이너의 호스트 포트를 읽지 못했다 (job.services.postgres.ports)."
            exit 1
          fi
          echo "일회용 Postgres 호스트 포트 = $POSTGRES_HOST_PORT"
          echo "DATABASE_URL=postgresql://postgres@localhost:${POSTGRES_HOST_PORT}/preflight" >> "$GITHUB_ENV"
          echo "DIRECT_URL=postgresql://postgres@localhost:${POSTGRES_HOST_PORT}/preflight" >> "$GITHUB_ENV"

      # `node_modules` 캐시 — 사유·실측은 아래 test 잡의 같은 스텝 주석 참조.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      # 빌드가 ISR 프리렌더로 DB 를 읽으므로 스키마가 먼저 있어야 한다. 이 단계가
      # 종전의 `P2022`(ISR 이 읽는 테이블에 컬럼을 추가하면 preflight 만 실패하던 문제)를
      # 닫는다 — 빌드 앞단의 prisma-migrate-on-deploy.mjs 는 `VERCEL_ENV` 미설정이라
      # CI 에서 skip 되므로, 여기서 명시적으로 적용해야 한다.
      - name: Apply migrations to the ephemeral database
        run: npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Run release preflight
        run: npm run release:check

  # 비차단 테스트 잡 — release:check(배포 프리플라이트) 게이트와 병렬·독립 실행된다.
  # 이 잡에는 prod 시크릿을 주입하지 않으며(env 블록 없음), test:ci가 DATABASE_URL을
  # SQLite(file:./dev.db)로 강제하므로 어떤 테스트도 실제 DB에 접근할 수 없다.
  # 비-hermetic 3개 파일은 vitest.config.ts에서 HERMETIC_ONLY=1로 제외(사유는 config 주석 참조).
  test:
    # push(=머지 직후 main) 런에서는 건너뛴다 — squash 머지는 PR 마지막 커밋과 같은 트리를
    # 만들고, 그 트리는 방금 PR 런의 이 잡이 검증했다. GitHub Free 사설 레포의 Actions
    # 무료분(월 2,000분)에서 이 잡이 런당 ~12분(단일 최중량)이라, 머지당 중복 재실행이
    # 예산의 주범이었다(2026-07-20 실측: 5일 1,901분 중 preflight가 94%). 배포 안전망은
    # 그대로다: preflight 잡(release:check=lint+build)은 push에서도 돌고, Vercel 프로덕션
    # 빌드가 같은 커밋을 독립적으로 다시 빌드한다(실패 시 배포 중단 fail-safe).
    if: github.event_name != 'push'
    # preflight 잡과 같은 토글 — 변수 하나로 두 잡이 함께 오간다(절반만 폴백되는
    # 상태를 만들지 않는다).
    runs-on: ${{ vars.PREFLIGHT_RUNNER != '' && vars.PREFLIGHT_RUNNER || 'ubuntu-latest' }}
    # ⏱ 이 값은 **성능 예산이 아니라 hang 백스톱**이다 — 느린 테스트를 덮는 마개로 쓰지 말 것.
    # 20 분이던 것을 30 분으로 올렸다(2026-08-26). 사유는 **폴백 레인의 절벽**이다:
    #   · 자가호스트 레인(현행) — 실측 7분00초~12분56초(중앙값 10분06초). 여유가 충분하다.
    #   · GitHub 러너 폴백 — 실측 18분01초~18분58초. 20 분 대비 여유가 **1 분 남짓**이고,
    #     자가호스트 첫 시도에서 실제로 20분21초 초과 취소가 한 번 났다.
    # 폴백은 「맥 러너 사망 = 전 PR 머지 불가」를 막는 탈출구인데(P6 Self-Hosted Preflight
    # Runner), 그 탈출구가 상시 시간초과에 붙어 있으면 탈출구 구실을 못 한다. 30 분은
    # preflight 잡과 같은 값이라 hang 한 run 의 비용 상한도 이미 그 수준이다.
    # ⚠️ 시간초과 취소는 실패 메시지가 「테스트 실패」가 아니라 「취소」로 나와 원인이
    # 가려진다 — 그래서 여유를 얇게 두는 것 자체가 진단 비용이다.
    timeout-minutes: 30
    # 테스트를 4조각으로 나눠 병렬로 돌린다(2026-08-28, 공개 레포 이전 직후).
    # 실측: 분할 전 이 잡의 테스트 스텝이 582초(9.7분)였고 잡 전체가 11.5~20분이었다.
    # ⚠️ **공개 레포가 됐기 때문에 가능해진 선택이다** — 러너를 4대 쓰는 셈이라
    # 비공개 무료 한도(월 2,000분)에서는 소모가 4배가 돼 즉시 한도를 넘겼고,
    # 자가호스트 레인은 활성 러너가 2대뿐이라 애초에 4분할을 소화하지 못했다.
    # 🪤 **필수 체크 이름이 `test` 에서 `test (1)`…`test (4)` 로 바뀐다** — 브랜치
    # 보호를 켤 때 그 네 이름을 등록해야 한다(옛 `test` 하나만 걸면 영원히 pending).
    strategy:
      fail-fast: false # 한 조각이 깨져도 나머지 결과를 봐야 원인이 좁혀진다
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          # ⚠️ 자가호스트에서는 npm 캐시를 **끈다**(빈 값 = 비활성). 이 캐시는 GitHub
          # 캐시 서비스에서 내려받는 것이라 데이터센터 밖 러너에서는 순손해다 —
          # 실측(2026-08-26): 416MB 를 0.4~0.9MB/s 로 받아 이 스텝 하나가 12분,
          # test 잡이 20분 타임아웃으로 취소됐다. 자가호스트 러너는 홈의 `~/.npm`
          # (실측 480MB)이 잡 사이에 그대로 남으므로 원격 캐시가 애초에 필요 없다.
          # GitHub 러너로 폴백하면(변수 없음) 작업 공간이 매번 새것이라 캐시가 다시
          # 이득이므로, 러너 토글과 같은 변수로 함께 갈린다.
          cache: ${{ vars.PREFLIGHT_RUNNER == '' && 'npm' || '' }}

      # `node_modules` 자체를 캐시한다 — 위 `setup-node` 캐시는 **내려받은 패키지
      # 보관소(`~/.npm`)만** 재사용하고 압축 해제·링크는 매번 다시 한다. 실측
      # (2026-08-28): 캐시가 켜진 상태에서도 `npm ci` 가 두 run 연속 90~143초였다.
      # 키를 lockfile 해시로 잡아 의존성이 바뀌면 자동으로 무효가 된다.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate Prisma clients (Postgres + SQLite)
        # ⚠️ 캐시 적중 시에도 반드시 돈다 — 생성물에 머신 절대경로가 박히므로
        # `node_modules` 와 함께 캐시하면 다른 러너에서 깨진다(.gitignore 주석 참조).
        run: npm run db:generate

      - name: Run hermetic test subset (isolated SQLite — no prod secrets)
        env:
          # 자가호스트 러너는 활성 2개가 같은 VM(4 vCPU)을 나눠 쓴다 — 상한이 없으면 vitest 가
          # 잡마다 nproc 만큼 워커를 띄워 초과구독되고, 5초 testTimeout 이 터진다(사유·실측은
          # vitest.config.ts 주석). ⚠️ vCPU 는 2026-08-27 에 8→4 로 내려갔다(P6 T-070) —
          # 상한 3 은 nproc(=4)보다 여전히 작아 구실을 한다. 인하 A/B 에서 이 값을 함께
          # 바꾸지 않은 것은 의도다(한 번에 한 가지만 바꿔야 차이를 귀속시킬 수 있다). GitHub 러너로 폴백하면 잡이 머신을 독점하므로 빈 값 =
          # 상한 없음으로 되돌린다 — 러너 토글과 같은 변수로 두 레인이 함께 갈린다.
          VITEST_MAX_WORKERS: ${{ vars.PREFLIGHT_RUNNER != '' && '3' || '' }}
        run: npm run test:ci -- --shard=${{ matrix.shard }}/4
